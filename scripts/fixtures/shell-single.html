;visibility&quot;:[{&quot;field&quot;:&quot;source&quot;,&quot;operator&quot;:&quot;equals&quot;,&quot;value&quot;:&quot;Other&quot;}],&quot;dependsOn&quot;:[&quot;source&quot;]}]" data-copy="{&quot;sending&quot;:&quot;Sending…&quot;,&quot;back&quot;:&quot;Back&quot;,&quot;next&quot;:&quot;Continue&quot;}" novalidate><h3 class="rf-heading rf-heading--left rf-heading--rule">Project details</h3><p class="rf-description rf-span-12">Tell us about the project &amp; budget.</p><div class="rf-section rf-section--labeled" role="separator"><span class="rf-section-label">Contact</span></div><div class="rf-field rf-span-6"><label for="snapshot__name" class="rf-label">Full name</label><input id="snapshot__name" name="name" type="text" autocomplete="name" required placeholder="Jane Doe" class="rf-input" /></div><div class="rf-field rf-span-6"><label for="snapshot__email" class="rf-label">Email<span class="rf-optional"> Optional</span></label><input id="snapshot__email" name="email" type="email" autocomplete="email" required class="rf-input" /></div><h3 class="rf-heading rf-heading--right">Budget &amp; timing</h3><div class="rf-field rf-span-6"><label for="snapshot__budget" class="rf-label">Budget</label><select id="snapshot__budget" name="budget" required class="rf-input"><option>Under 5k</option><option>5–15k</option><option>15k+</option></select></div><div class="rf-field rf-span-6"><span class="rf-label" id="snapshot__interests-label">Interests</span><div class="rf-options" role="group" aria-labelledby="snapshot__interests-label"><label class="rf-option"><input type="checkbox" name="interests" value="Design" id="snapshot__interests-0" /><span>Design</span></label><label class="rf-option"><input type="checkbox" name="interests" value="Build" id="snapshot__interests-1" /><span>Build</span></label><label class="rf-option"><input type="checkbox" name="interests" value="Support" id="snapshot__interests-2" /><span>Support</span></label></div></div><div class="rf-field rf-span-6"><span class="rf-label" id="snapshot__source-label">How did you hear?</span><div class="rf-options" role="group" aria-labelledby="snapshot__source-label"><label class="rf-option"><input type="radio" name="source" value="Referral" required id="snapshot__source-0" /><span>Referral</span></label><label class="rf-option"><input type="radio" name="source" value="Search" required id="snapshot__source-1" /><span>Search</span></label><label class="rf-option"><input type="radio" name="source" value="Other" required id="snapshot__source-2" /><span>Other</span></label></div></div><div class="rf-field rf-span-6"><label class="rf-option rf-option--single"><input type="checkbox" id="snapshot__consent" name="consent" required /><span class="rf-label">I agree to the privacy policy</span></label></div><hr class="rf-divider" /><div class="rf-divider rf-divider--spacer" style="min-height: 2rem"></div><div class="rf-field rf-span-12"><label for="snapshot__message" class="rf-label">Message</label><textarea id="snapshot__message" name="message" rows="5" required placeholder="How can we help?" maxlength="500" class="rf-input rf-textarea"></textarea></div><div class="rf-field rf-span-6"><label for="snapshot__website" class="rf-label">Your website</label><input id="snapshot__website" name="website_url" type="url" placeholder="https://…" class="rf-input" /></div><div class="rf-field rf-span-6"><label for="snapshot__players" class="rf-label">Headcount</label><input id="snapshot__players" name="players" type="number" min="1" max="50" step="1" class="rf-input" /></div><div class="rf-field rf-span-6"><label for="snapshot__phone" class="rf-label">Phone</label><input id="snapshot__phone" name="phone" type="tel" pattern="[0-9+\s-]{7,}" class="rf-input" /></div><div class="rf-field rf-span-6"><label for="snapshot__brief" class="rf-label">Attach a brief</label><input id="snapshot__brief" name="brief" type="file" accept=".pdf,.docx" multiple class="rf-input" /></div><div class="rf-field rf-span-6 rf-field--hidden"><input type="hidden" id="snapshot__referrer" name="referrer" value="sf" /></div><div class="rf-field rf-span-6"><label for="snapshot__other_source" class="rf-label">Other source</label><input id="snapshot__other_source" name="other_source" type="text" required class="rf-input" /></div><div class="rf-submit-row"><button class="rf-submit rf-submit--primary" type="submit">Send message <span aria-hidden="true">→</span></button></div><input type="text" name="website" data-honeypot="true" tabindex="-1" autocomplete="off" aria-hidden="true" class="rf-honeypot" /><p class="rf-status" role="status" hidden>Thanks — we&#39;ll be in touch.</p></form>
